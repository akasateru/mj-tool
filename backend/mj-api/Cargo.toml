[package]
name = "mj-api"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Shuttle にバックエンドのみデプロイ。DB は Supabase を使うため shuttle-shared-db は使わない。
shuttle = ["dep:shuttle-runtime", "dep:shuttle-axum"]

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "any", "sqlite", "postgres", "time", "uuid"] }
anyhow = "1"

mj-domain = { path = "../mj-domain" }

shuttle-runtime = { version = "0.54", optional = true }
shuttle-axum = { version = "0.54", optional = true }
